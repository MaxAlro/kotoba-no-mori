<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kotoba no Mori</title>
<meta name="theme-color" content="#2C4A86">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kotoba">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: app de una columna para celular, barra inferior fija con 5 secciones; el kanji grande en mincho es el protagonista, todo lo demás va en gótica sobria. */
:root{
  --paper:#EDF0F4; --surface:#FFFFFF; --ink:#17202D; --muted:#5A6476; --line:#D3DAE4;
  --ai:#2C4A86; --ai-soft:#DDE5F4; --ki:#8F6400; --ki-soft:#F5E6B9;
  --ok:#2E7A4D; --ok-soft:#DCEFE3; --bad:#A93838; --bad-soft:#F6DEDE;
  --f-display:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:10px; --nav-h:62px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0D121B; --surface:#161D29; --ink:#E4E8EF; --muted:#98A2B4; --line:#2A3344;
  --ai:#94AEE6; --ai-soft:#22304D; --ki:#E2BC5E; --ki-soft:#3A3017;
  --ok:#6DBF8C; --ok-soft:#1C3527; --bad:#E58080; --bad-soft:#3C2022; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0D121B; --surface:#161D29; --ink:#E4E8EF; --muted:#98A2B4; --line:#2A3344;
  --ai:#94AEE6; --ai-soft:#22304D; --ki:#E2BC5E; --ki-soft:#3A3017;
  --ok:#6DBF8C; --ok-soft:#1C3527; --bad:#E58080; --bad-soft:#3C2022; color-scheme:dark}

*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);color-scheme:light}
[hidden]{display:none!important}
img{max-width:100%}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ai);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom,0px))}
header.top{display:flex;align-items:center;gap:12px;padding-block:4px 14px}
.logo{font-family:var(--f-display);font-weight:800;font-size:30px;line-height:1;color:var(--ai)}
.brand{display:flex;flex-direction:column;line-height:1.2}
.brand b{font-size:15px;letter-spacing:.02em}
.brand small{color:var(--muted);font-size:12px}
.top .sync{margin-left:auto;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.ok{background:var(--ok)} .dot.bad{background:var(--bad)}

h1{font-size:22px;line-height:1.3;margin:0;text-wrap:balance}
h2{font-size:17px;margin:0;text-wrap:balance}
h3{font-size:13px;margin:0;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:700}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:14px}
.stack.tight{gap:8px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.section{display:flex;flex-direction:column;gap:10px}
.divider{height:1px;background:var(--line);margin-block:4px}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 14px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;text-decoration:none}
.btn:hover{border-color:var(--ai)}
.btn.primary{background:var(--ai);border-color:var(--ai);color:var(--surface);font-weight:700}
.btn.ghost{background:transparent}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{min-height:34px;padding:6px 10px;font-size:13px}
.speak{border:none;background:var(--ai-soft);color:var(--ai);border-radius:50%;width:34px;height:34px;min-height:34px;padding:0;cursor:pointer;display:inline-grid;place-items:center;flex:none}
.speak svg{width:16px;height:16px}

.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700;background:var(--ai-soft);color:var(--ai);white-space:nowrap}
.chip.ki{background:var(--ki-soft);color:var(--ki)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.plain{background:transparent;border:1px solid var(--line);color:var(--muted)}

label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:500}
input[type=text],input[type=number],input[type=url],select,textarea{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:10px 12px;color:var(--ink);font-size:16px;width:100%;min-width:0}
textarea{min-height:90px;resize:vertical}
.jp-input{font-size:20px !important}

/* Hoy */
.today-date{font-family:var(--f-display);font-size:15px;color:var(--muted)}
.big-num{font-family:var(--f-mono);font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.stat{display:flex;flex-direction:column;gap:4px}
.stat span{font-size:12px;color:var(--muted)}
.plan-line{display:grid;grid-template-columns:84px 1fr;gap:10px;font-size:14px}
.plan-line b{font-family:var(--f-mono);font-size:13px;color:var(--ai)}
.phase-bar{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.phase-bar div{height:6px;border-radius:3px;background:var(--line)}
.phase-bar div.done{background:var(--ai)}
.phase-bar div.now{background:var(--ki)}

/* Repaso */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px 18px;display:flex;flex-direction:column;gap:14px;align-items:stretch;min-height:340px}
.card .face{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.card .kind{align-self:flex-start}
.glyph{font-family:var(--f-display);font-weight:800;font-size:96px;line-height:1.05}
.word-glyph{font-family:var(--f-display);font-weight:800;font-size:52px;line-height:1.2;word-break:keep-all}
.sentence{font-size:19px;line-height:1.7}
.sentence mark{background:var(--ki-soft);color:inherit;padding:0 2px;border-radius:3px}
.reading{font-size:20px;color:var(--ai);font-weight:700}
.meaning{font-size:19px;font-weight:700}
.literal{font-size:14px;color:var(--ki);font-weight:500}
.decomp{display:flex;flex-direction:column;gap:8px;text-align:left}
.decomp-item{display:grid;grid-template-columns:48px 1fr;gap:12px;align-items:start;padding:10px;border-radius:8px;background:var(--paper)}
.decomp-item .k{font-family:var(--f-display);font-size:36px;line-height:1;text-align:center;cursor:pointer;color:var(--ai)}
.decomp-item .formula{font-family:var(--f-display);font-size:17px}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grades button{display:flex;flex-direction:column;gap:2px;padding:8px 4px;min-height:58px}
.grades small{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.g0{border-color:var(--bad) !important;color:var(--bad)}
.g3{border-color:var(--ok) !important;color:var(--ok)}
.progress-line{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.progress-line i{display:block;height:100%;background:var(--ai)}
.traslado .glyph{font-size:120px}
.traslado .grades button{min-height:72px;font-size:17px}

/* Grafo */
.graph-box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.graph-box svg{display:block;width:100%;height:auto;max-width:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);padding:8px 12px;border-top:1px solid var(--line)}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}
.node{cursor:pointer}
.node:focus{outline:none}
.node:focus-visible circle,.node:focus-visible rect{stroke:var(--ki);stroke-width:3}
.results{display:flex;flex-direction:column;gap:6px}
.result{display:flex;gap:10px;align-items:baseline;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer;text-align:left}
.result b{font-family:var(--f-display);font-size:20px}
.kanji-strip{display:flex;gap:6px;flex-wrap:wrap}
.kanji-strip button{font-family:var(--f-display);font-size:22px;width:44px;height:44px;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer}
.kgroup{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:10px 12px}
.kgroup summary{display:flex;align-items:center;gap:8px;cursor:pointer;list-style:none;font-weight:700}
.kgroup summary::-webkit-details-marker{display:none}
.kgroup summary::before{content:"▸";color:var(--muted);font-size:12px;transition:transform .15s}
.kgroup[open] summary::before{transform:rotate(90deg)}
.kgroup .kg-name{font-family:var(--f-display);font-size:17px;white-space:pre}
.kgroup .chip{margin-left:auto}
.kgroup .kanji-strip{margin-top:10px}
.kanji-strip button.ktile{width:66px;height:auto;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:2px}
.ktile b{font-size:24px;line-height:1.1;font-weight:600}
.ktile small{font-family:var(--f-body);font-size:10px;color:var(--muted);max-width:60px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kanji-strip button.inSrs{border-color:var(--ai)}
.kanji-strip button.comp{color:var(--muted);border-style:dashed}

/* Paquetes */
.pack{display:flex;flex-direction:column;gap:6px;padding:14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);cursor:pointer;text-align:left;width:100%}
.pack .meta{display:flex;gap:6px;flex-wrap:wrap}
.vocab{display:flex;flex-direction:column}
.vocab-row{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.vocab-row:last-child{border-bottom:none}
.vocab-row .jp{font-family:var(--f-display);font-size:22px;font-weight:600}
.vocab-row .es{min-width:0}
.gram{padding:12px;border-radius:8px;background:var(--paper);display:flex;flex-direction:column;gap:6px}
.gram b{font-family:var(--f-display);font-size:18px}
.steps{display:flex;gap:6px}
.steps button{flex:1;font-size:12px;padding:8px 4px;min-height:38px}
.logrow{display:grid;grid-template-columns:1fr 40px 64px 40px;gap:6px;align-items:center;font-size:14px}
.logrow .min{text-align:center}
.on-chip{background:var(--ai-soft) !important;border-color:var(--ai) !important;color:var(--ai)}
.steps button.on{background:var(--ai-soft);border-color:var(--ai);color:var(--ai);font-weight:700}

/* Progreso */
.chart{width:100%;height:auto;display:block;max-width:100%}
.chart text{fill:var(--muted);font-family:var(--f-mono);font-size:10px}
.timeline{display:flex;flex-direction:column;gap:0}
.tl{display:grid;grid-template-columns:18px 1fr;gap:12px}
.tl .rail{display:flex;flex-direction:column;align-items:center}
.tl .rail i{width:12px;height:12px;border-radius:50%;border:2px solid var(--line);background:var(--surface);margin-top:5px}
.tl .rail span{flex:1;width:2px;background:var(--line)}
.tl.done .rail i{background:var(--ai);border-color:var(--ai)}
.tl.now .rail i{background:var(--ki);border-color:var(--ki)}
.tl .body{padding-bottom:14px}
.hours{display:grid;grid-template-columns:1fr 92px;gap:8px;align-items:center}
.hours input{text-align:right}
.meter{height:10px;background:var(--line);border-radius:5px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--ai)}
.countdown{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* Diagnóstico */
.q-glyph{font-family:var(--f-display);font-size:64px;line-height:1.2;text-align:center;font-weight:800}
.q-text{font-size:20px;text-align:center}
.options{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.options button{min-height:56px;font-size:18px}
.options button.right{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.options button.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.score-row{display:grid;grid-template-columns:110px 1fr 44px;gap:10px;align-items:center;font-size:14px}

.empty{padding:22px 16px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;color:var(--muted)}
.empty .glyph{font-size:64px;color:var(--line)}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
nav.tabs .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--nav-h)}
nav.tabs button{border:none;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--muted);font-size:11px;font-weight:500;position:relative}
nav.tabs button b{font-family:var(--f-display);font-size:21px;line-height:1;font-weight:800}
nav.tabs button[aria-current="page"]{color:var(--ai)}
nav.tabs button .badge{position:absolute;top:6px;left:calc(50% + 8px);background:var(--ki);color:var(--surface);font-family:var(--f-mono);font-size:10px;border-radius:999px;padding:0 5px;line-height:16px}

.kbd-hint{display:none}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 14px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:8px;font-size:14px;z-index:30;max-width:calc(100% - 32px)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spin{animation:none}}
@media (max-width:380px){.glyph{font-size:80px}.word-glyph{font-size:42px}.grid2{grid-template-columns:1fr}}

/* Laptop: menú lateral y contenido en columnas */
@media (min-width: 900px){
  :root{--side:208px}
  .wrap{max-width:1160px;margin:0;margin-left:var(--side);padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:max(32px,env(safe-area-inset-right,0px));padding-block:24px 48px}
  @media (min-width: 1400px){.wrap{margin-left:calc(var(--side) + (100vw - var(--side) - 1160px) / 2)}}
  nav.tabs{top:0;bottom:0;right:auto;width:var(--side);border-top:none;border-right:1px solid var(--line);padding:calc(24px + env(safe-area-inset-top,0px)) 12px 24px max(12px,env(safe-area-inset-left,0px))}
  nav.tabs .in{display:flex;flex-direction:column;gap:4px;height:auto;max-width:none;margin:0}
  nav.tabs button{flex-direction:row;justify-content:flex-start;gap:12px;padding:10px 12px;border-radius:8px;font-size:14px;min-height:46px}
  nav.tabs button:hover{background:var(--paper)}
  nav.tabs button[aria-current="page"]{background:var(--ai-soft)}
  nav.tabs button .badge{position:static;margin-left:auto}
  .toast{bottom:24px;left:calc(var(--side) + (100% - var(--side)) / 2)}
  h1{font-size:26px}
  .v-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;align-items:start}
  .v-grid > h1,.v-grid > .section,.v-grid > .countdown{grid-column:1/-1}
  .v-grafo{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:18px;align-items:start;grid-auto-flow:row dense}
  .v-grafo > *{grid-column:1/-1}
  .v-grafo > .graph-box{grid-column:1;grid-row:span 3}
  .v-grafo > .g-detail,.v-grafo > .g-all{grid-column:2}
  .pack-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
  .v-wide > .btn.primary{align-self:flex-start}
  .v-narrow{max-width:720px;margin-inline:auto;width:100%}
  .v-grafo > .graph-box svg{max-width:520px;margin:0 auto}
  .kbd-hint{display:block !important}
  .card{min-height:380px}
  .countdown{grid-template-columns:repeat(2,minmax(0,280px))}
}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="logo" aria-hidden="true">森</div>
    <div class="brand"><b>Kotoba no Mori</b><small>言葉の森 · camino a N2</small></div>
    <button class="sync" id="sync" type="button" style="border:none;background:none;cursor:pointer"><span class="dot"></span><span>Cargando…</span></button>
  </header>
  <main id="main"></main>
</div>
<nav class="tabs" aria-label="Secciones"><div class="in" id="tabs"></div></nav>

<script>
"use strict";
/* ---------- utilidades ---------- */
const $ = (s, r = document) => r.querySelector(s);
function h(tag, a, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(a || {})) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k.startsWith("on") && typeof v === "function") el.addEventListener(k.slice(2), v);
    else if (k === "value") el.value = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat(Infinity)) { if (c == null || c === false) continue; el.append(c instanceof Node ? c : String(c)); }
  return el;
}
const SVGNS = "http://www.w3.org/2000/svg";
function s(tag, a, ...kids) {
  const el = document.createElementNS(SVGNS, tag);
  for (const [k, v] of Object.entries(a || {})) {
    if (v == null) continue;
    if (k.startsWith("on") && typeof v === "function") el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v);
  }
  for (const c of kids.flat(Infinity)) { if (c == null) continue; el.append(c instanceof Node ? c : document.createTextNode(String(c))); }
  return el;
}
const DAY = 864e5;
const dayStart = t => { const d = new Date(t); d.setHours(0, 0, 0, 0); return d.getTime(); };
const dayKey = (t = Date.now()) => { const d = new Date(t); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
function weekKey(t = Date.now()) {
  const d = new Date(t); d.setHours(0, 0, 0, 0);
  const day = (d.getDay() + 6) % 7; d.setDate(d.getDate() - day + 3);
  const y = d.getFullYear(); const jan4 = new Date(y, 0, 4);
  const w = 1 + Math.round(((d - jan4) / DAY - 3 + ((jan4.getDay() + 6) % 7)) / 7);
  return y + "-W" + String(w).padStart(2, "0");
}
function weekMonday(t = Date.now()) { const d = new Date(dayStart(t)); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return d.getTime(); }
const KANJI_RE = /[㐀-䶿一-鿿々]/g;
const kanjiOf = str => [...new Set((str || "").match(KANJI_RE) || [])].filter(c => c !== "々");
const kid = ch => "k" + ch.codePointAt(0).toString(16);
const fmtInt = n => n < 1 ? "<1 d" : n < 30 ? n + " d" : n < 365 ? Math.round(n / 30) + " m" : (n / 365).toFixed(1) + " a";
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
function store(k, v) { try { if (v === undefined) return JSON.parse(localStorage.getItem(k)); localStorage.setItem(k, JSON.stringify(v)); } catch { return null; } }
let toastTimer;

function schedule(c, g, now = Date.now()) {
  let { interval = 0, ease = 2.5, reps = 0, lapses = 0 } = c; let due;
  if (g === 0) { if (reps > 0) lapses++; reps = 0; interval = 0; ease = Math.max(1.3, ease - 0.2); due = now + 10 * 60e3; }
  else {
    if (reps === 0) interval = g === 3 ? 4 : 1;
    else if (reps === 1) interval = g === 1 ? 2 : g === 2 ? 3 : 6;
    else interval = Math.max(interval + 1, Math.round(interval * (g === 1 ? 1.2 : g === 2 ? ease : ease * 1.35)));
    if (g === 1) ease = Math.max(1.3, ease - 0.15);
    if (g === 3) ease += 0.15;
    reps++; due = dayStart(now) + interval * DAY + 3 * 3600e3;
  }
  return { ...c, interval, ease: Math.round(ease * 100) / 100, reps, lapses, due, last: now };
}

}

/* ---------- arranque ---------- */
async function boot() {
  db = localDb; S.conn = "ok";
  for (const [key, path] of Object.entries(COLS)) {
    db.collection(path).onSnapshot(snap => {
      const m = new Map(); snap.docs.forEach(d => m.set(d.id, d.data()));
      S[key] = m; S.loaded.add(key); render();
    });
  }
  db.doc("config/main").onSnapshot(d => { if (d.exists) S.config = { ...S.config, ...d.data() }; render(); });
  render();
  loadPackFiles(); if (Sync.cfg) syncNow();
  window.addEventListener("online", () => { loadPackFiles(); syncNow(); });
  window.addEventListener("offline", () => { if (Sync.cfg) { Sync.state = "offline"; renderSync(); } });
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") { loadPackFiles(); if (Sync.cfg) syncNow(); } else if (Local.dirty && Sync.cfg) syncNow(); });
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
}
